[project]
name = "find-alan"
version = "0.1.0"
description = "Runnable scripts for find-alan."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gradio>=5.0.0",
    "diffusers>=0.33.0",
    "transformers>=4.52",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "accelerate>=1.13.0",
    "pillow>=11.0",
    "numpy>=2.0",
    "safetensors>=0.5",
    "huggingface-hub>=0.21.0",
    "ultralytics>=8.0.0",
    "opencv-python-headless>=4.10",
    "sentencepiece>=0.1.99",
    "ipykernel>=6.0",
]

[project.scripts]
find-alan = "find_alan.scripts.hello:main"
find-alan-gui = "find_alan.scripts.gui:main"
find-alan-inpaint = "find_alan.scripts.inpaint:main"
find-alan-insert = "find_alan.scripts.insert:main"
find-alan-insert-detected = "find_alan.scripts.insert_detected:main"
find-alan-prepare-examples = "find_alan.scripts.prepare_examples:main"
find-alan-refine = "find_alan.scripts.refine:main"
find-alan-crop-plan = "find_alan.scripts.crop_plan:main"
find-alan-upscale = "find_alan.scripts.upscale:main"
find-alan-generate = "find_alan.scripts.generate:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ty>=0.0.46",
]

# linux-aarch64 (Isambard/Grace-Hopper) needs PyTorch wheels from the PyTorch
# CUDA index; standard PyPI doesn't carry aarch64 CUDA builds.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "platform_machine == 'aarch64' and sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "platform_machine == 'aarch64' and sys_platform == 'linux'" },
]
