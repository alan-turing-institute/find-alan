[project]
name = "find-alan"
version = "0.1.0"
description = "Runnable scripts for find-alan."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "diffusers>=0.27.0",
    "transformers>=4.38.0",
    # CPU/MPS: pip/uv install torch torchvision
    # CUDA:    pip install torch torchvision --index-url https://download.pytorch.org/whl/cu121
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "accelerate>=0.27.0",
    "Pillow>=10.0.0",
    "numpy>=1.26.0",
    "safetensors>=0.4.2",
    "huggingface-hub>=0.21.0",
    "ultralytics>=8.0.0",
    "opencv-python-headless>=4.10",
    "pillow>=11.0",
    "safetensors>=0.5",
    "transformers>=4.52",
    "ipykernel>=6.0",
    # "torchvision>=0.24",
]

[project.optional-dependencies]
ml = [
    "accelerate>=1.13.0",
    "diffusers[torch]>=0.38.0",
    "numpy>=2.0",
    "pillow>=11.0",
    "safetensors>=0.5",
    "transformers>=4.52",
]

[project.scripts]
find-alan = "find_alan.scripts.hello:main"
find-alan-inpaint = "find_alan.scripts.inpaint:main"
find-alan-insert = "find_alan.scripts.insert:main"
find-alan-insert-detected = "find_alan.scripts.insert_detected:main"
find-alan-prepare-examples = "find_alan.scripts.prepare_examples:main"
find-alan-refine = "find_alan.scripts.refine:main"
find-alan-crop-plan = "find_alan.scripts.crop_plan:main"
find-alan-upscale = "find_alan.scripts.upscale:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ty>=0.0.46",
]
